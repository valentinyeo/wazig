# Cut a release whenever app code lands on main.
#
# release.yml already builds and publishes from a vX.Y.Z tag, and takes the
# version straight from the tag name. So releasing automatically just means
# creating that tag automatically, once CI has gone green on the commit.
name: auto-release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor]
        default: patch

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only ever tag a commit CI has passed. A manual run is trusted.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse to tag a commit that is no longer the head of main
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${TESTED_SHA}" ]; then
            echo "main has moved on (tested ${TESTED_SHA}, head ${head})."
            echo "The newer commit gets its own CI run and its own release."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Honour [skip release]
        if: env.skip != 'true'
        run: |
          subject="$(git log -1 --pretty=%B)"
          case "${subject}" in
            *"[skip release]"*|*"[release skip]"*)
              echo "commit asks for no release"
              echo "skip=true" >> "$GITHUB_ENV" ;;
          esac

      - name: Skip if this commit is already released
        if: env.skip != 'true'
        run: |
          # One release tag per commit: a rerun or a second successful CI run
          # for the same HEAD must not mint another version.
          if git tag -l 'v*' --points-at HEAD | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "HEAD already carries a release tag"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Release only when the app itself changed
        if: env.skip != 'true'
        run: |
          # Strict vX.Y.Z only: prerelease or four-part tags must never feed
          # the version bump.
          last="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)"
          if [ -z "${last}" ]; then
            echo "no previous tag, treating as releasable"
            echo "last_tag=v0.0.0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "last_tag=${last}" >> "$GITHUB_ENV"

          # Anything that ends up inside the shipped binary or installer.
          if git diff --name-only "${last}..HEAD" \
             | grep -qE '^(src/|assets/|vendor/|build\.zig)'; then
            echo "app changed since ${last}"
          else
            echo "only non-app files changed since ${last}, no release"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Prove manual runs point at a CI-green main HEAD
        # A manual dispatch is not trusted: like the automatic path, it may
        # only tag a commit for which a completed, successful ci run exists.
        if: env.skip != 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "head_sha=${sha}" >> "$GITHUB_ENV"
          if [ "$(gh run list -R "${GITHUB_REPOSITORY}" -w ci -b main --commit "${sha}" --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")] | length')" = "0" ]; then
            echo "no successful ci run for main HEAD ${sha}; refusing to tag" >&2
            exit 1
          fi

      - name: Work out the next version
        if: env.skip != 'true'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          v="${last_tag#v}"
          major="${v%%.*}"; rest="${v#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          case "${BUMP}" in
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists, refusing to move it"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "next_tag=${next}" >> "$GITHUB_ENV"
          echo "Releasing ${last_tag} -> ${next}"

      - name: Tag it
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Revalidate main did not move under us since the checks above.
          sha="$(git rev-parse HEAD)"
          if [ -n "${head_sha:-}" ] && [ "${sha}" != "${head_sha}" ]; then
            echo "main moved during the run; aborting" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next_tag}" -f "sha=${sha}" >/dev/null \
            || echo "${next_tag} already points at this commit; proceeding"
          # Single release path: the tag push is what starts release.yml.
          # GITHUB_TOKEN ref creation is not guaranteed to fire the push
          # trigger, so wait briefly for the release run and dispatch only as
          # a fallback; the fallback can at worst double-start the same tag
          # and release.yml is re-run safe (create-or-clobber upload).
          for _ in 1 2 3 4 5 6; do
            sleep 10
            if [ -n "$(gh run list -R "${GITHUB_REPOSITORY}" -w release --commit "${sha}" -L 1 --json databaseId -q 'length')" ]; then
              echo "release run started by the tag push"
              echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "push trigger did not start release.yml; dispatching it at the tag"
          gh workflow run release.yml -R "${GITHUB_REPOSITORY}" --ref "${next_tag}"
          echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag created and the release workflow dispatched on it." >> "$GITHUB_STEP_SUMMARY"
