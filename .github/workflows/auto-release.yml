# Cut a release whenever app code lands on main.
#
# release.yml already builds and publishes from a vX.Y.Z tag, and takes the
# version straight from the tag name. So releasing automatically just means
# creating that tag automatically, once CI has gone green on the commit.
name: auto-release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor]
        default: patch

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only ever tag a commit CI has passed. A manual run is trusted.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse to tag a commit that is no longer the head of main
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${TESTED_SHA}" ]; then
            echo "main has moved on (tested ${TESTED_SHA}, head ${head})."
            echo "The newer commit gets its own CI run and its own release."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Honour [skip release]
        if: env.skip != 'true'
        run: |
          subject="$(git log -1 --pretty=%B)"
          case "${subject}" in
            *"[skip release]"*|*"[release skip]"*)
              echo "commit asks for no release"
              echo "skip=true" >> "$GITHUB_ENV" ;;
          esac

      - name: Skip if this commit is already released
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release tag per commit: a rerun or a second successful CI run
          # for the same HEAD must not mint another version. But if a previous
          # attempt tagged this commit and never started release.yml (the
          # push trigger is not guaranteed for GITHUB_TOKEN refs), finish the
          # job here instead of skipping: dispatch at the existing tag.
          tag="$(git tag -l 'v*' --points-at HEAD | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | tail -1 || true)"
          if [ -n "${tag}" ]; then
            # Server-side commit filter and a generous limit, so old tags and
            # page truncation cannot hide a completed release run.
            runs_json="$(gh run list -R "${GITHUB_REPOSITORY}" -w release --commit "$(git rev-parse HEAD)" -L 50 \
              --json event,headBranch,headSha,status,conclusion 2>/dev/null)" || runs_json=""
            if [ -z "${runs_json}" ]; then
              echo "could not query release runs for this commit; failing closed" >&2
              exit 1
            fi
            read -r running done_ok < <(echo "${runs_json}" | jq -r --arg tag "${tag}" '
              map(select((.event == "push" or .event == "workflow_dispatch") and .headBranch == $tag))
              | [(map(select(.status != "completed")) | length), (map(select(.conclusion == "success")) | length)]
              | "\(.[0]) \(.[1])"')
            if [ "${running:-0}" -ge 1 ] 2>/dev/null || [ "${done_ok:-0}" -ge 1 ] 2>/dev/null; then
              echo "HEAD already carries a release tag and its release ran or is running"
              echo "skip=true" >> "$GITHUB_ENV"
            else
              echo "HEAD is tagged ${tag} but has no successful release run; dispatching release.yml"
              gh workflow run release.yml -R "${GITHUB_REPOSITORY}" --ref "${tag}"
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

      - name: Release only when the app itself changed
        if: env.skip != 'true'
        run: |
          # Strict vX.Y.Z only: prerelease or four-part tags must never feed
          # the version bump.
          last="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)"
          if [ -z "${last}" ]; then
            echo "no previous tag, treating as releasable"
            echo "last_tag=v0.0.0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "last_tag=${last}" >> "$GITHUB_ENV"

          # Anything that ends up inside the shipped binary or installer.
          if git diff --name-only "${last}..HEAD" \
             | grep -qE '^(src/|assets/|vendor/|build\.zig)'; then
            echo "app changed since ${last}"
          else
            echo "only non-app files changed since ${last}, no release"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Prove manual runs point at a CI-green main HEAD
        # A manual dispatch is not trusted: like the automatic path, it may
        # only tag a commit for which a completed, successful ci run exists.
        if: env.skip != 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "head_sha=${sha}" >> "$GITHUB_ENV"
          # Fail closed: a failed query must count as "no proof".
          ci_ok="$(gh run list -R "${GITHUB_REPOSITORY}" -w ci -b main --commit "${sha}" --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")] | length' 2>/dev/null)" || ci_ok=""
          if ! [ "${ci_ok:-}" -ge 1 ] 2>/dev/null; then
            echo "no successful ci run for main HEAD ${sha} (or the query failed); refusing to tag" >&2
            exit 1
          fi

      - name: Work out the next version
        if: env.skip != 'true'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          v="${last_tag#v}"
          major="${v%%.*}"; rest="${v#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          case "${BUMP}" in
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists, refusing to move it"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "next_tag=${next}" >> "$GITHUB_ENV"
          echo "Releasing ${last_tag} -> ${next}"

      - name: Tag it
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Revalidate main against the remote, not the local checkout:
          # both local reads stay equal even if main has moved on.
          sha="$(git rev-parse HEAD)"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${sha}" != "${remote_main}" ]; then
            echo "main is now ${remote_main}, not the checked-out ${sha}; aborting" >&2
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next_tag}" -f "sha=${sha}" >/dev/null; then
            # Refuse to publish a tag some concurrent run may have pointed
            # elsewhere; compare against the remote ref, not local state,
            # and only proceed if it already tags exactly this commit.
            remote_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${next_tag}" --jq .object.sha 2>/dev/null || true)"
            if [ -z "${remote_tag}" ]; then
              echo "could not create ${next_tag} and it does not exist remotely" >&2
              exit 1
            fi
            if [ "${remote_tag}" != "${sha}" ]; then
              # Annotated tags point at a tag object; peel to the commit,
              # recursing if a tag was made pointing at another tag.
              for _ in 1 2 3; do
                read -r obj_type obj_sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag}" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null || echo "missing -")
                if [ "${obj_type}" = "commit" ]; then remote_tag="${obj_sha}"; break; fi
                if [ "${obj_type}" != "tag" ]; then break; fi
                remote_tag="${obj_sha}"
              done
              if [ "${remote_tag}" != "${sha}" ]; then
                echo "${next_tag} exists remotely but not at ${sha}" >&2
                exit 1
              fi
            fi
          fi
          # Single release path: the tag push is what starts release.yml.
          # The push trigger fires from the ref creation (observed in the
          # duplicate-release incident), so wait for a release run that is
          # really this tag at this commit before falling back to a dispatch;
          # release.yml is re-run safe (create-or-clobber upload) either way.
          for _ in 1 2 3 4 5 6; do
            sleep 10
            started="$(gh run list -R "${GITHUB_REPOSITORY}" -w release --commit "${sha}" -L 50 \
              --json event,headBranch,headSha \
              -q "[.[] | select((.event == \"push\" or .event == \"workflow_dispatch\") and .headBranch == \"${next_tag}\")] | length")"
            if [ "${started}" != "0" ]; then
              echo "release run started by the tag push"
              echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "push trigger did not start release.yml; dispatching it at the tag"
          gh workflow run release.yml -R "${GITHUB_REPOSITORY}" --ref "${next_tag}"
          echo "### Released ${next_tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag created and the release workflow dispatched on it." >> "$GITHUB_STEP_SUMMARY"
