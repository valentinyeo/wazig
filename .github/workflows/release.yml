# Tag vX.Y.Z on main -> build Messages.exe, package zip + per-user MSI on GitHub
# runners, smoke-test the MSI on a real Windows runner, publish a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check tag shape
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z" >&2; exit 1 ;;
          esac
      - name: Install toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build
      - name: Restore TDLib
        id: tdcache
        uses: actions/cache@v4
        with:
          path: /tmp/tdlib-install
          key: tdlib-master-d1085f9-v1
      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          P=/tmp/tdbuild-prefix
          mkdir -p "$P" /tmp/tdlib-install
          git clone --depth 1 https://github.com/madler/zlib.git /tmp/zlibsrc
          (cd /tmp/zlibsrc && CC=x86_64-w64-mingw32-gcc ./configure --static --prefix="$P" && make -j$(nproc) install)
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl.git /tmp/opensslsrc
          (cd /tmp/opensslsrc && ./Configure mingw64 no-shared no-tests no-docs --prefix="$P" --cross-compile-prefix=x86_64-w64-mingw32- && make -j$(nproc) -s install_sw)
          git clone --depth 1 https://github.com/tdlib/td.git /tmp/tdsrc
          cmake -S /tmp/tdsrc -B /tmp/tdsrc/build -G Ninja \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$P" \
            -DZLIB_INCLUDE_DIR="$P/include" \
            -DZLIB_LIBRARY="$P/lib/libz.a" \
            -DCMAKE_INSTALL_PREFIX:PATH=/tmp/tdlib-install \
            -DTD_ENABLE_JNI=OFF
          cmake --build /tmp/tdsrc/build --target tdjson_static install
      - name: Build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ]; then
            echo "Release builds require the TELEGRAM_API_ID and TELEGRAM_API_HASH secrets" >&2
            exit 1
          fi
          zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}" \
            -Dtdlib=/tmp/tdlib-install \
            -Dtelegram-api-id="$TELEGRAM_API_ID" \
            -Dtelegram-api-hash="$TELEGRAM_API_HASH"
      - name: Package zip
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe *.ttf *LICENSE*
      - name: Package MSI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wixl wixl-data
          version="${GITHUB_REF_NAME#v}"
          # MSI ProductVersion must be exactly three numeric components; refuse
          # anything else instead of building an installer that cannot upgrade.
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          wixl -D "Version=${version}" -D "BinDir=${GITHUB_WORKSPACE}/zig-out/bin/" \
            -o "Messages-${GITHUB_REF_NAME}.msi" assets/installer.wxs
      - name: Checksums
        run: |
          sha256sum "Messages-${GITHUB_REF_NAME}.zip" "Messages-${GITHUB_REF_NAME}.msi" > SHA256SUMS.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            Messages-*.zip
            Messages-*.msi
            SHA256SUMS.txt

  smoke:
    name: msi smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Install silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem Messages-*.msi).FullName
          # Call msiexec directly: Start-Process -PassThru uses ShellExecute and
          # leaves ExitCode null on Windows PowerShell 5.1, so the exit status
          # was unreadable. /L*V keeps a full log to diagnose any real failure.
          & msiexec /i $msi /qn /norestart /L*V install.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content install.log -Tail 40
            throw "msiexec install failed: $code"
          }
      - name: Verify install
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Messages\Messages.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Messages.lnk"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Messages\IBMPlexSans-Regular.ttf")) { throw "missing bundled font" }
          if (-not (Test-Path $lnk)) { throw "missing Start menu shortcut $lnk" }
      - name: Uninstall silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem Messages-*.msi).FullName
          & msiexec /x $msi /qn /norestart | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "msiexec uninstall failed: $code" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Messages\Messages.exe") { throw "exe left behind after uninstall" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Messages.lnk") { throw "shortcut left behind after uninstall" }

  release:
    name: release
    needs: [build, smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run safe: first create publishes with assets attached (atomic);
          # on a re-run create fails because the release exists, so clobber-upload instead.
          gh release create "${GITHUB_REF_NAME}" Messages-*.zip Messages-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" Messages-*.zip Messages-*.msi SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
