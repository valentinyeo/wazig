# Tag vX.Y.Z on main -> build Messages.exe on GitHub runners -> publish a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check tag shape
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z" >&2; exit 1 ;;
          esac
      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe *.ttf *LICENSE*
          cd "${GITHUB_WORKSPACE}" && sha256sum "Messages-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run safe: first create publishes with assets attached (atomic);
          # on a re-run create fails because the release exists, so clobber-upload instead.
          gh release create "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
