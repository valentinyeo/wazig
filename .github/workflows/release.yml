name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: release
    runs-on: [self-hosted, wazig]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag
        run: echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}$'

      - name: Zig version
        run: $HOME/.local/zig-0.16/zig version

      - name: Build
        run: $HOME/.local/zig-0.16/zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}"

      - name: Test
        run: $HOME/.local/zig-0.16/zig build test

      - name: Package
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe IBMPlexSans-Regular.ttf IBMPlexSans-SemiBold.ttf IBM-Plex-LICENSE.txt
          sha256sum "Messages-${GITHUB_REF_NAME}.zip" > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
