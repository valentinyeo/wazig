# Tag vX.Y.Z on main -> build Messages.exe on GitHub runners -> publish a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z, got ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          zig build -Dtarget=x86_64-windows-gnu --release=small -Dversion="${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          cd zig-out/bin
          zip -r "${GITHUB_WORKSPACE}/Messages-${GITHUB_REF_NAME}.zip" Messages.exe *.ttf *LICENSE*
          cd "${GITHUB_WORKSPACE}" && sha256sum "Messages-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "Messages-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
