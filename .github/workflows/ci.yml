name: ci

on:
  push:
    branches: [main]
  pull_request:
  # automerge.yml dispatches ci on main after a GITHUB_TOKEN squash merge,
  # because merges made with that token do not fire the push trigger.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Test
        run: zig build test

      - name: Stretch tests
        run: zig test src/stretch.zig

      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu --release=small

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64
          path: zig-out/bin/

  # Builds TDLib for Windows once and links the Telegram-enabled binary.
  # The install dir is cached, so the expensive C++ build runs only when the
  # pinned TDLib commit or this script changes.
  tdlib:
    name: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TDLIB_COMMIT: d1085f9cebc5a62379991ae1652673954f229c1f
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gperf php-cli cmake ninja-build

      - name: Restore TDLib
        id: tdcache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tdlib-install
            /tmp/tdbuild-prefix
          key: tdlib-${{ env.TDLIB_COMMIT }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          P=/tmp/tdbuild-prefix
          mkdir -p "$P" /tmp/tdlib-install
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/zlibsrc
          (cd /tmp/zlibsrc && CC=x86_64-w64-mingw32-gcc ./configure --static --prefix="$P" && make -j$(nproc) install)
          # Integrity: this tarball is statically linked into the shipped binary; pin the
          # sha256 published on the official openssl-3.3.2 GitHub release.
          echo '2e8a40b01979afe8be0bbfb3de5dc1c6709fedb46d6c89c10da114ab5fc3d281  /tmp/openssl.tar.gz' > /tmp/openssl.sha256
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 -o /tmp/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz
          sha256sum -c /tmp/openssl.sha256
          mkdir -p /tmp/opensslsrc && tar -C /tmp/opensslsrc --strip-components=1 -xzf /tmp/openssl.tar.gz
          (cd /tmp/opensslsrc && ./Configure mingw64 no-asm no-shared no-tests no-docs --libdir=lib --prefix="$P" --cross-compile-prefix=x86_64-w64-mingw32- && make -j1 -s install_sw)
          cp -n "$P/lib64"/*.a "$P/lib/" 2>/dev/null || true
          git clone https://github.com/tdlib/td.git /tmp/tdsrc
          (cd /tmp/tdsrc && git checkout "$TDLIB_COMMIT")
          # Stage 1: build TDLib's host generators natively; they write the
          # generated sources into the shared source tree.
          cmake -S /tmp/tdsrc -B /tmp/tdsrc/build-host -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=OFF
          cmake --build /tmp/tdsrc/build-host --target prepare_cross_compiling -j$(nproc)
          # Stage 2: cross-compile TDLib itself for Windows.
          cmake -S /tmp/tdsrc -B /tmp/tdsrc/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$P" \
            -DZLIB_INCLUDE_DIR="$P/include" \
            -DZLIB_LIBRARY="$P/lib/libz.a" \
            -DTD_ENABLE_JNI=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build /tmp/tdsrc/build --target tdjson_static -j$(nproc)
          mkdir -p /tmp/tdlib-install/lib /tmp/tdlib-install/include/td
          find /tmp/tdsrc/build -name '*.a' -exec cp {} /tmp/tdlib-install/lib/ \;
          cp "$P"/lib/libcrypto.a "$P"/lib/libssl.a "$P"/lib/libz.a /tmp/tdlib-install/lib/
          for m in tdactor tdclient tdcore tdnet tdutils tddb tdmtproto tde2e; do cp -r /tmp/tdsrc/$m/td/. /tmp/tdlib-install/include/td/ 2>/dev/null || true; done
          cp -r /tmp/tdsrc/td/. /tmp/tdlib-install/include/td/
          cp -r /tmp/tdsrc/td/generate/auto/td/. /tmp/tdlib-install/include/td/

      # Placeholder credentials: this artifact exists for the Windows smoke
      # test only, and workflow artifacts are readable by anyone with repo
      # access, so the real API credentials are compiled in exclusively by
      # release.yml.
      - name: Build with Telegram (placeholder credentials)
        run: |
          zig build -Dtarget=x86_64-windows-gnu --release=small \
            -Dtdlib=/tmp/tdlib-install \
            -Dtelegram-api-id=1 \
            -Dtelegram-api-hash=smoke-placeholder

      - name: Exe size report
        run: |
          du -h zig-out/bin/Messages.exe

      - name: Upload Telegram build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: zig-out/bin/

  # Runs the Telegram-enabled exe headlessly on a real Windows machine to
  # prove TDLib loads, opens its database and reaches the first auth state.
  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    needs: tdlib
    timeout-minutes: 10
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: Messages-windows-x86_64-telegram
          path: bin/

      - name: Run TDLib smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "bin\Messages.exe" -ArgumentList "--tdlib-smoke" -Wait -PassThru
          exit $p.ExitCode

  # WAZI-68 affected-machine verification: runs the shipped unfurl code
  # (link classifier, live card fetch, card painter, MFPlay player window,
  # fullscreen toggle) on a real Windows desktop, without a WhatsApp
  # session, and uploads the screenshots and result log as evidence.
  unfurl-verification:
    name: unfurl-verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Messages.exe
        run: zig build -Dtarget=x86_64-windows-gnu --release=small

      - name: Run unfurl smoke on this Windows machine
        shell: pwsh
        env:
          UNFURL_SMOKE_DIR: smoke-out
        run: |
          $p = Start-Process -FilePath "zig-out\bin\Messages.exe" -ArgumentList "--unfurl-smoke" -Wait -PassThru
          if (Test-Path "smoke-out\results.txt") { Get-Content "smoke-out\results.txt" | Write-Host }
          exit $p.ExitCode

      - name: Upload unfurl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfurl-verification-evidence
          path: smoke-out/

  # A ci run on main that was started by workflow_dispatch (the automerge
  # bot-merge path and the automerge self-heal) gets no downstream
  # workflow_run trigger: GitHub does not fire workflow_run for runs that
  # were themselves dispatched. Push-triggered ci runs already start
  # auto-release through workflow_run, so this handoff is dispatch-only.
  notify-release:
    name: notify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, tdlib, windows-smoke]
    # success() must stay explicit: a job-level if replaces the implicit
    # all-dependencies-succeeded check.
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: write
    steps:
      - name: Hand off to auto-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # auto-release re-verifies everything itself (head of main, tag
          # dedupe, app-files-changed) before it tags anything.
          # Retry transient dispatch failures: this handoff is the only
          # auto-release trigger for heads without a push-triggered ci run.
          for _ in 1 2 3; do
            if gh workflow run auto-release.yml -R "${GITHUB_REPOSITORY}" --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
