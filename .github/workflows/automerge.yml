# Merge green, low-risk agent PRs by itself so they don't pile up in AI Review.
# Runs only from the default-branch copy (workflow_run / schedule / dispatch), never
# from a PR's own copy. Skips: drafts, `hold` label, edits to this file, red or
# missing `ci`, merge conflicts. Size and workflow edits are not gates: rollback is
# the safety net, a person is never the default blocker.
name: automerge
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: automerge
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  # Dispatching ci.yml on main after a GITHUB_TOKEN merge, which suppresses
  # the push-triggered ci run the release pipeline depends on.
  actions: write
  checks: read
jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge green low-risk PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # A PR merges only when every release-gating check is present and
          # green on its current head: pending, skipped, or failed copies of
          # a required check block, and duplicate names cannot hide a red run.
          required='["ci","tdlib","windows-smoke","code-review"]'
          for pr in $(gh pr list -R "$REPO" --state open --json number -q '.[].number'); do
            info=$(gh pr view "$pr" -R "$REPO" --json isDraft,labels,additions,deletions,files,mergeable,statusCheckRollup,headRefOid)
            head_oid=$(echo "$info" | jq -r .headRefOid)
            blocked=$(echo "$info" | jq -r --argjson req "$required" '
              ([.statusCheckRollup[]] as $roll
               | [ $req[] as $r
                   | if ([ $roll[] | select(.name == $r and .conclusion == "SUCCESS") ] | length) == 0
                       or ([ $roll[] | select(.name == $r and .conclusion != "SUCCESS") ] | length) > 0
                     then $r else empty end ] )
              | join(",")')
            reason=$(echo "$info" | jq -r --argjson gate '[".github/workflows/automerge.yml", ".github/workflows/ci.yml", ".github/workflows/release.yml", ".github/workflows/auto-release.yml"]' '
              if .isDraft then "draft"
              elif ([.labels[].name] | index("hold")) then "hold label"
              elif ([.files[].path] | map(select(. == $gate[])) | length) > 0 then "edits a release-gating workflow, needs manual review"
              elif .mergeable != "MERGEABLE" then "not mergeable (\(.mergeable))"
              else "" end')
            if [ "${reason}" = "null" ] || [ -z "${reason}" ] && [ "$(echo "$info" | jq -r '.isDraft, .mergeable' | head -c 0)x" = "x" ]; then :; fi
            if [ -n "$blocked" ]; then reason="required checks not green: ${blocked}"; fi
            if [ -n "$reason" ]; then echo "#$pr: skip ($reason)"; continue; fi
            # --match-head-commit closes the race: if the PR head changes
            # between the checks we read and the merge, GitHub refuses it.
            if gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$head_oid"; then
              echo "#$pr: merged"
              # The GITHUB_TOKEN merge suppresses the push-triggered ci on
              # main; start it for the resulting commit so the auto-release
              # pipeline still fires. ponytail: workflow_dispatch runs at the
              # current main head, so if main advances between merge and
              # dispatch the intermediate commit may miss its own release;
              # only main HEAD is ever tagged anyway.
              merged_oid=$(gh pr view "$pr" -R "$REPO" --json mergeCommit -q .mergeCommit.oid) || merged_oid=""
              if ! echo "${merged_oid}" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "#$pr: could not resolve the merge commit; not starting ci" >&2
                exit 1
              fi
              ci_started=""
              for _ in 1 2 3; do
                gh workflow run ci.yml -R "$REPO" --ref main
                sleep 15
                # Only a numeric count of at least one successful run counts;
                # a failed query must not be read as "ci started".
                # If main moved on, the newer commit carries the ci run that
                # feeds the release pipeline; our commit is no longer head.
                main_now=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null) || main_now=""
                if [ -n "${main_now}" ] && [ "${main_now}" != "${merged_oid}" ]; then
                  echo "#$pr: main advanced to ${main_now}; its ci run feeds the release"
                  ci_started=1
                  break
                fi
                # Any run for the commit (even queued) proves the dispatch
                # landed; re-dispatching while ci is merely slow would only
                # duplicate runs.
                count=$(gh run list -R "$REPO" -w ci -b main --commit "$merged_oid" --json databaseId -q 'length' 2>/dev/null) || count=""
                if [ "${count:-0}" -ge 1 ] 2>/dev/null; then
                  echo "#$pr: ci dispatched on main (${merged_oid})"
                  ci_started=1
                  break
                fi
                echo "#$pr: ci run not visible yet, retrying dispatch"
              done
              # Without ci on the merged commit the release pipeline never
              # fires, so a silent failure here must not look like success.
              if [ -z "$ci_started" ]; then
                echo "#$pr: could not start ci on main after 3 dispatches" >&2
                exit 1
              fi
            else
              echo "#$pr: merge failed"
            fi
          done
